<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ลงเวลา ร้านเจ๊จู</title>
<link rel="preload" as="script" href="https://static.line-scdn.net/liff/edge/2/sdk.js">
<link rel="preconnect" href="https://script.google.com">
<style>
  :root { --red:#d62828; --green:#2a9d55; --blue:#1d6fdc; --ink:#222; --soft:#f4f4f4; --line:#ddd; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Sukhumvit Set", "Noto Sans Thai", sans-serif; color:var(--ink); background:#fff8f0; }
  header { background:var(--red); color:#fff; padding:16px; text-align:center; }
  header h1 { margin:0; font-size:20px; }
  header .who { margin-top:4px; font-size:15px; opacity:.95; }
  main { padding:16px; max-width:480px; margin:0 auto; }
  .card { background:#fff; border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .hide { display:none !important; }
  button { font:inherit; border:0; border-radius:12px; padding:14px; width:100%; font-size:18px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.45; }
  .big { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .big button { padding:26px 8px; font-size:20px; }
  .in { background:var(--green); color:#fff; }
  .out { background:var(--red); color:#fff; }
  .sec { background:var(--soft); color:var(--ink); border:1px solid var(--line); }
  .go { background:var(--blue); color:#fff; margin-top:10px; }
  select, textarea { width:100%; font:inherit; font-size:17px; padding:12px; border-radius:10px; border:1px solid var(--line); background:#fff; }
  textarea { resize:vertical; margin-top:8px; }
  label { display:block; font-weight:600; margin:16px 0 6px; }
  .muted { color:#666; font-size:14px; }
  .ok { color:var(--green); } .warn { color:#c77800; } .bad { color:var(--red); }
  #preview, #doneImg { width:100%; border-radius:10px; margin-top:8px; }
  .done { text-align:center; }
  .done .time { font-size:56px; font-weight:800; margin:6px 0; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .today li { margin:4px 0; }
  .spin { text-align:center; padding:30px 0; }
  .branchBox { border:2px solid var(--blue); border-radius:12px; padding:12px 14px; background:#f0f6ff; }
  .branchBox .hint { font-size:14px; color:#456; }
  .branchBox .bname { font-size:24px; font-weight:800; margin:2px 0 4px; line-height:1.25; }
  .change { margin-top:8px; }
  .change .muted { margin-bottom:4px; }
  .change select { font-size:15px; padding:9px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chips button { width:auto; font-size:15px; font-weight:500; padding:9px 12px; border-radius:20px; background:var(--soft); border:1px solid var(--line); }
  .chips button.on { background:#ffe7c2; border-color:#e5a54b; }
  .ver { text-align:center; color:#aaa; font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<header>
  <h1>ลงเวลาทำงาน ร้านเจ๊จู</h1>
  <div class="who" id="who"></div>
</header>
<main>
  <div class="card spin" id="loading">กำลังโหลด...</div>
  <div class="card hide" id="error"></div>

  <!-- ลงทะเบียนครั้งแรก -->
  <div class="card hide" id="regBox">
    <b>ลงทะเบียนครั้งแรก</b>
    <p class="muted">เลือกชื่อของตัวเอง ทำครั้งเดียว เลือกแล้วเปลี่ยนเองไม่ได้ ถ้าเลือกผิดให้แจ้งเจ๊</p>
    <select id="regName"></select>
    <button class="go" id="regBtn">ยืนยัน นี่คือชื่อของฉัน</button>
  </div>

  <!-- หน้าหลัก -->
  <div id="mainBox" class="hide">
    <div class="card">
      <div class="big">
        <button class="in" id="btnIn">ลงเวลา<br>เข้างาน</button>
        <button class="out" id="btnOut">ลงเวลา<br>ออกงาน</button>
      </div>
      <ul class="today muted" id="todayList"></ul>
    </div>
  </div>

  <!-- ขั้นตอนลงเวลา -->
  <div id="stepBox" class="hide">
    <div class="card">
      <b id="stepTitle"></b>

      <label>1. สาขา</label>
      <div class="branchBox">
        <div class="hint" id="branchHint">กำลังหาตำแหน่ง...</div>
        <div class="bname" id="branchName"></div>
        <div id="gpsStatus" class="muted"></div>
      </div>
      <div class="change">
        <div class="muted">ไม่ใช่สาขานี้? กดเปลี่ยนได้</div>
        <select id="branch"></select>
      </div>

      <label>2. ถ่ายรูปตัวเองที่ร้าน</label>
      <input type="file" id="photo" accept="image/*" capture="user" class="hide">
      <button class="sec" id="photoBtn">📷 เปิดกล้อง</button>
      <img id="preview" class="hide" alt="">

      <label>3. หมายเหตุ <span class="muted">(ไม่บังคับ)</span></label>
      <div class="chips" id="chips">
        <button type="button" data-t="มาสาย - ไปทำธุระ">มาสาย - ไปทำธุระ</button>
        <button type="button" data-t="กลับก่อน - ไปทำธุระ">กลับก่อน - ไปทำธุระ</button>
        <button type="button" data-t="">อื่นๆ</button>
      </div>
      <textarea id="note" rows="2" maxlength="200" placeholder="พิมพ์เพิ่มได้ เช่น ไปหาหมอ / รถเสีย"></textarea>

      <button class="go" id="sendBtn" disabled>บันทึกเวลา</button>
      <button class="sec" id="cancelBtn" style="margin-top:8px">ยกเลิก</button>
    </div>
  </div>

  <!-- ถามยืนยันเมื่อนอกรัศมี / GPS ไม่ชัด -->
  <div class="card hide" id="confirmBox">
    <div id="confirmMsg"></div>
    <div class="row2">
      <button class="sec" id="retryBtn">ลองใหม่</button>
      <button class="out" id="forceBtn">ลงเวลาเลย</button>
    </div>
  </div>

  <!-- สำเร็จ -->
  <div class="card done hide" id="doneBox">
    <div id="doneType"></div>
    <div class="time" id="doneTime"></div>
    <div id="doneName"></div>
    <div id="doneInfo" class="muted"></div>
    <div id="doneNote" class="muted"></div>
    <div id="doneFlags" class="warn"></div>
    <div id="doneGroup" class="muted"></div>
    <img id="doneImg" alt="">
    <button class="sec" id="closeBtn" style="margin-top:16px">ปิด</button>
  </div>

  <!-- เลขฉบับ: หน้า = index.html บน GitHub / ระบบ = Code.gs ที่ Deploy แล้ว (ขึ้น ? = ยังเป็นโค้ดเก่า) -->
  <div class="ver" id="ver"></div>
</main>

<script>
// ===== ค่าระบบ =====
const LIFF_ID = '2012745769-tDbhTx2R';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwI0pvDcEvNOINQqjuMFuqW7DjmueQPfFcn0udlsT3Ay-7bvHKtGhdonPaWtoSixujQpw/exec';
const PAGE_VERSION = '3.5 (28/11)';   // เลขฉบับของหน้านี้ — แก้หน้าครั้งหน้าให้เปลี่ยนเลขนี้ด้วย
// ==================

const $ = id => document.getElementById(id);
let serverVer = '';
function showVer() { $('ver').textContent = 'หน้า v' + PAGE_VERSION + ' · ระบบ v' + (serverVer || '…'); }
const show = (...ids) => ids.forEach(i => $(i).classList.remove('hide'));
const hide = (...ids) => ids.forEach(i => $(i).classList.add('hide'));
let state = { branches: [], me: {}, type: '', pos: null, live: null, auto: '', manual: false, raw: null, stamped: null, prep: null, prepP: null, sending: false };

// โหลดระบบไลน์แบบไม่บังหน้าจอ (หน้าเว็บขึ้นปุ่มได้ก่อน ไลน์โหลดตามหลัง)
let liffReady = null;
function loadSdk() {
  return new Promise((ok, no) => {
    if (window.liff) return ok();
    const s = document.createElement('script');
    s.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
    s.charset = 'utf-8';
    s.onload = () => ok();
    s.onerror = () => no(new Error('โหลดระบบไลน์ไม่สำเร็จ ปิดแล้วเปิดใหม่อีกครั้ง'));
    document.head.appendChild(s);
  });
}

async function api(action, data) {
  await liffReady;
  const idToken = liff.getIDToken();
  const res = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action, idToken }, data || {}))
  });
  const out = await res.json();
  serverVer = out.ver || '? (โค้ดเก่า)'; showVer();
  if (!out.ok) throw new Error(out.error || 'เกิดข้อผิดพลาด');
  return out;
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c])); }

function fail(msg) {
  hide('loading');
  $('error').innerHTML = '<b class="bad">ทำรายการไม่สำเร็จ</b><p>' + esc(msg) + '</p>';
  show('error');
}

// ----- จำข้อมูลพนักงานไว้ในมือถือ (เปิดครั้งต่อไปขึ้นปุ่มทันที ไม่ต้องรอระบบ) -----
let cacheKey = '';
function loadMe() { try { return JSON.parse(localStorage.getItem(cacheKey) || 'null'); } catch (e) { return null; } }
function saveMe(d) {
  try { localStorage.setItem(cacheKey, JSON.stringify({ nickname: d.nickname, fullName: d.fullName || '', code: d.code, branches: state.branches })); } catch (e) {}
}
function clearMe() { try { localStorage.removeItem(cacheKey); } catch (e) {} }

const LAST_KEY = 'jj_me_last';   // จำว่ามือถือเครื่องนี้ใช้บัญชีไลน์ไหนล่าสุด

function showCached(c) {
  if (!(c && c.branches && c.branches.length)) return false;
  state.branches = c.branches;
  hide('loading');
  showMain(c);
  startGps();
  return true;
}

async function start() {
  showVer();
  let cached = null;
  // 1) ขึ้นปุ่มทันทีจากข้อมูลที่มือถือจำไว้ ไม่ต้องรอไลน์ (ตอนกดบันทึกยังยืนยันตัวตนกับไลน์จริงเหมือนเดิม)
  try { const last = localStorage.getItem(LAST_KEY); if (last) { cacheKey = last; cached = loadMe(); } } catch (e) {}
  if (!showCached(cached)) cached = null;
  liffReady = loadSdk().then(() => liff.init({ liffId: LIFF_ID }));
  try {
    await liffReady;
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const tok = liff.getDecodedIDToken();
    const key = 'jj_me_' + (tok && tok.sub ? tok.sub : 'x');
    if (key !== cacheKey) {
      // คนละบัญชีไลน์กับที่มือถือจำไว้ → ซ่อนปุ่มเดิม ใช้ข้อมูลของบัญชีนี้แทน
      if (cached) { hide('mainBox', 'stepBox', 'confirmBox', 'doneBox'); show('loading'); $('who').textContent = ''; }
      cacheKey = key;
      cached = loadMe();
      if (!showCached(cached)) cached = null;
    }
    try { localStorage.setItem(LAST_KEY, cacheKey); } catch (e) {}
    // เช็กกับระบบเบื้องหลัง (อัปเดตรายการวันนี้ / ชื่อ / สาขา)
    const d = await api('init');
    state.branches = d.branches;
    hide('loading');
    if (d.registered) {
      saveMe(d);
      renderMe(d);
      if (!cached) { showMain(d); startGps(); }
    } else {
      clearMe();
      hide('mainBox', 'stepBox', 'confirmBox', 'doneBox');
      $('who').textContent = d.lineName;
      $('regName').innerHTML = '<option value="">-- เลือกชื่อ --</option>' +
        d.names.map(n => `<option value="${esc(n.nickname)}">${esc(n.nickname)}${n.fullName ? ' — ' + esc(n.fullName) : ''}</option>`).join('');
      show('regBox');
    }
  } catch (e) {
    if (!cached) fail(e.message);
  }
}

// ชื่อที่หัวจอ + รายการที่ลงไปแล้ววันนี้
function renderMe(d) {
  state.me = { nickname: d.nickname, fullName: d.fullName || '', code: d.code };
  $('who').innerHTML = '<b>' + esc(d.nickname) + '</b>' + (d.fullName ? ' · ' + esc(d.fullName) : '') +
    '<div style="font-size:13px;opacity:.85">' + esc(d.code) + '</div>';
  const list = d.today || [];
  $('todayList').innerHTML = list.length
    ? '<li><b>วันนี้ลงไปแล้ว</b></li>' + list.map(s => `<li>${esc(s.type)} ${esc(s.time)} น. · ${esc(s.branch)}</li>`).join('')
    : '';
}

function showMain(d) {
  renderMe(d);
  hide('regBox', 'stepBox', 'confirmBox', 'doneBox');
  show('mainBox');
}

$('regBtn').onclick = async () => {
  const n = $('regName').value;
  if (!n) return alert('กรุณาเลือกชื่อ');
  $('regBtn').disabled = true;
  try { const d = await api('register', { nickname: n }); saveMe(d); showMain(d); startGps(); }
  catch (e) { fail(e.message); }
  $('regBtn').disabled = false;
};

// ----- เริ่มลงเวลา -----
$('btnIn').onclick = () => begin('เข้า');
$('btnOut').onclick = () => begin('ออก');

function begin(type) {
  state.type = type; state.raw = null; state.stamped = null; state.prep = null; state.prepP = null; state.pos = null; state.auto = ''; state.manual = false;
  $('stepTitle').textContent = type === 'เข้า' ? 'ลงเวลาเข้างาน' : 'ลงเวลาออกงาน';
  $('branch').innerHTML = state.branches.map(b => `<option>${esc(b.name)}</option>`).join('');
  $('preview').src = ''; hide('preview', 'mainBox', 'confirmBox');
  $('photoBtn').textContent = '📷 เปิดกล้อง';
  $('note').value = '';
  document.querySelectorAll('#chips button').forEach(b => b.classList.remove('on'));
  show('stepBox');
  // ใช้ตำแหน่งที่หาไว้ตั้งแต่เปิดหน้า ถ้ายังใหม่ (ไม่เกิน 2 นาที)
  if (state.live && Date.now() - state.live.at < 120000) applyPos(state.live);
  else getGps();
  check();
}

// ----- GPS: เริ่มหาตั้งแต่เปิดหน้า และอัปเดตต่อเนื่อง -----
const GPS_OPT = { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 };
let watching = false;
const onStep = () => !$('stepBox').classList.contains('hide');

function startGps() {
  if (watching || !navigator.geolocation) return;
  watching = true;
  navigator.geolocation.watchPosition(onPos, onGpsErr, GPS_OPT);
}

function onPos(p) {
  state.live = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, at: Date.now() };
  if (onStep() && !state.sending) applyPos(state.live);
}

function onGpsErr(err) {
  if (!onStep() || state.pos) return;
  $('branchHint').className = 'hint bad';
  $('branchHint').textContent = err.code === 1
    ? 'ไม่ได้อนุญาตให้ใช้ตำแหน่ง ไปที่ตั้งค่ามือถือ > LINE > ตำแหน่ง แล้วเปิดเป็น "อนุญาต"'
    : 'หาตำแหน่งไม่เจอ เปิด GPS แล้วกดยกเลิก เข้าใหม่อีกครั้ง';
}

function applyPos(live) {
  const changed = !state.pos || state.pos.lat !== live.lat || state.pos.lng !== live.lng;
  state.pos = { lat: live.lat, lng: live.lng, acc: live.acc };
  if (changed) state.stamped = null;
  // เลือกสาขาที่ใกล้ที่สุดให้อัตโนมัติ (ถ้าพนักงานยังไม่ได้เปลี่ยนเอง)
  let best = null;
  state.branches.forEach(b => {
    const d = dist(state.pos.lat, state.pos.lng, b.lat, b.lng);
    if (!best || d < best.d) best = { b, d };
  });
  if (best) { state.auto = best.b.name; if (!state.manual) $('branch').value = best.b.name; }
  updateGpsText();
  check();
}

function getGps() {
  state.pos = null; state.stamped = null; check();
  $('branchHint').className = 'hint';
  $('branchHint').textContent = 'กำลังหาตำแหน่ง...';
  $('branchName').textContent = '';
  $('gpsStatus').className = 'muted';
  $('gpsStatus').textContent = '';
  if (!navigator.geolocation) { $('branchHint').textContent = 'มือถือนี้ใช้ GPS ไม่ได้'; return; }
  startGps();
  navigator.geolocation.getCurrentPosition(onPos, onGpsErr, GPS_OPT);
}

function curBranch() { return state.branches.find(x => x.name === $('branch').value); }
function curDist() { const b = curBranch(); return Math.round(dist(state.pos.lat, state.pos.lng, b.lat, b.lng)); }

function updateGpsText() {
  if (!state.pos) return;
  const b = curBranch();
  const d = curDist();
  const inside = d <= b.radius;
  $('branchHint').className = 'hint';
  $('branchHint').textContent = b.name === state.auto ? '📍 ระบบเลือกให้ (ใกล้ที่สุด)' : '✋ เลือกเอง';
  $('branchName').textContent = b.name;
  $('gpsStatus').className = inside ? 'ok' : 'warn';
  $('gpsStatus').textContent = (inside ? '✅ อยู่ที่ร้าน · ห่าง' : '⚠️ อยู่ห่างร้าน') + ` ${d} เมตร (GPS ±${Math.round(state.pos.acc)} ม.)`;
}
$('branch').onchange = () => { state.manual = true; state.stamped = null; updateGpsText(); };

// ----- หมายเหตุ -----
document.querySelectorAll('#chips button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('#chips button').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    const t = btn.dataset.t;
    $('note').value = t ? t + ': ' : '';
    $('note').focus();
  };
});

// ----- รูป -----
$('photoBtn').onclick = () => $('photo').click();
$('photo').onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  state.raw = await shrink(f, 1024, 0.8);
  state.stamped = null;
  $('preview').src = state.raw; show('preview');
  $('photoBtn').textContent = '📷 ถ่ายใหม่';
  e.target.value = '';
  startPrep();   // ขอเวลาจากระบบไว้เลยตอนถ่ายรูปเสร็จ (ระหว่างพนักงานดูรูป/พิมพ์หมายเหตุ) กดบันทึกจะได้รอแค่รอบเดียว
  check();
};

// ขอเวลา + ลายเซ็นจากระบบ (เวลาที่บันทึกและประทับบนรูป = เวลาตอนถ่ายรูปเสร็จ ตามนาฬิการะบบ)
function startPrep() {
  const type = state.type;
  state.prep = null;
  const pr = api('prep', { type }).then(p => { p._at = Date.now(); if (state.prepP === pr) state.prep = p; return p; });
  pr.catch(() => {});   // ถ้าพลาด ไปขอใหม่ตอนกดบันทึก
  state.prepP = pr;
  return pr;
}

async function getPrep() {
  let p = null;
  try { if (state.prepP) p = await state.prepP; } catch (e) { p = null; }
  // ไม่มี / พลาด / เก่าเกิน 8 นาที (ระบบรับได้ 10 นาที) → ขอใหม่
  if (!p || Date.now() - p._at > 8 * 60000) p = await startPrep();
  return p;
}

function shrink(file, max, q) {
  return new Promise((ok, no) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      ok(c.toDataURL('image/jpeg', q));
    };
    img.onerror = no;
    img.src = URL.createObjectURL(file);
  });
}

// ----- ประทับข้อความลงรูป (แบบ Timemark) -----
function roundRect(g, x, y, w, h, r, color) {
  g.beginPath();
  g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
  g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y);
  g.closePath(); g.fillStyle = color; g.fill();
}

function fmtDur(min) {
  const h = Math.floor(min / 60), m = min % 60;
  return (h ? h + ' ชม. ' : '') + m + ' นาที';
}

function stampPhoto(src, t) {
  return new Promise((ok, no) => {
    const img = new Image();
    img.onload = () => {
      const W = img.width, H = img.height;
      const s = Math.min(W, H) / 760;
      const F = 'sans-serif';
      const c = document.createElement('canvas'); c.width = W; c.height = H;
      const g = c.getContext('2d');
      g.drawImage(img, 0, 0);
      g.textBaseline = 'middle';

      const P = Math.round(22 * s);
      const headH = Math.round(66 * s);
      const lineH = Math.round(40 * s);
      const barH = t.inTime ? Math.round(104 * s) : 0;
      const blockH = headH + lineH * 3 + P * 2.2;
      const top = H - barH - blockH;

      // พื้นเงาให้อ่านตัวหนังสือออก
      const fadeTop = Math.max(0, top - 50 * s);
      const grd = g.createLinearGradient(0, fadeTop, 0, H);
      grd.addColorStop(0, 'rgba(0,0,0,0)');
      grd.addColorStop(0.3, 'rgba(0,0,0,.5)');
      grd.addColorStop(1, 'rgba(0,0,0,.7)');
      g.fillStyle = grd; g.fillRect(0, fadeTop, W, H - fadeTop);

      // ป้าย เข้างาน/เลิกงาน + เวลา
      const lab = t.type === 'เข้า' ? 'เข้างาน' : 'เลิกงาน';
      const labF = `bold ${Math.round(34 * s)}px ${F}`, timeF = `bold ${Math.round(52 * s)}px ${F}`;
      g.font = labF; const lw = g.measureText(lab).width + P * 1.4;
      g.font = timeF; const tw = g.measureText(t.time).width + P * 1.4;
      const x = P, y = top + P;
      roundRect(g, x, y, lw + tw, headH, 10 * s, '#ffffff');
      roundRect(g, x, y, lw, headH, 10 * s, t.type === 'เข้า' ? '#2a9d55' : '#d62828');
      g.fillStyle = '#fff'; g.font = labF; g.fillText(lab, x + P * 0.7, y + headH / 2);
      g.fillStyle = '#111'; g.font = timeF; g.fillText(t.time, x + lw + P * 0.7, y + headH / 2);

      // 3 บรรทัด: วันที่ / ชื่อ / สาขา
      const ly0 = y + headH + P * 0.5;
      g.fillStyle = '#ffd166'; g.fillRect(x, ly0, Math.max(3, 4 * s), lineH * 3);
      const tx = x + 16 * s, maxW = W - tx - P;
      const lines = [
        t.day + ' ' + t.date,
        t.nickname + (t.fullName ? ' · ' + t.fullName : '') + ' · ' + t.code,
        t.branch + ' · ห่างร้าน ' + t.dist + ' ม.'
      ];
      g.fillStyle = '#fff';
      lines.forEach((L, i) => {
        g.font = `${i === 0 ? 'bold ' : ''}${Math.round(29 * s)}px ${F}`;
        g.fillText(L, tx, ly0 + lineH * i + lineH / 2, maxW);
      });

      // ชื่อร้าน มุมขวาบนของกล่อง
      g.font = `bold ${Math.round(22 * s)}px ${F}`;
      g.textAlign = 'right'; g.fillStyle = 'rgba(255,255,255,.85)';
      g.fillText('ร้านเจ๊จูลูกชิ้นปิ้ง', W - P, y + headH / 2);
      g.textAlign = 'left';

      // แถบล่างตอนเลิกงาน
      if (barH) {
        const by = H - barH;
        g.fillStyle = '#1d6fdc'; g.fillRect(0, by, W, barH);
        const half = W / 2;
        g.fillStyle = 'rgba(255,255,255,.85)'; g.font = `${Math.round(22 * s)}px ${F}`;
        g.fillText('เข้าเวร', P, by + 28 * s);
        g.fillText('เวลาทำงาน', half + P * 0.5, by + 28 * s);
        g.fillStyle = '#fff'; g.font = `bold ${Math.round(40 * s)}px ${F}`;
        g.fillText(t.inTime + ' - ' + t.time, P, by + 70 * s, half - P * 1.5);
        g.fillText(fmtDur(t.workMin), half + P * 0.5, by + 70 * s, half - P * 1.5);
      }
      ok(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = no;
    img.src = src;
  });
}

function check() { $('sendBtn').disabled = !(state.pos && state.raw) || state.sending; }

// ----- ส่ง -----
$('sendBtn').onclick = () => send(false);
$('forceBtn').onclick = () => send(true);
$('retryBtn').onclick = () => { hide('confirmBox'); show('stepBox'); getGps(); };
$('cancelBtn').onclick = () => { hide('stepBox'); show('mainBox'); };
$('closeBtn').onclick = () => { if (liff.isInClient()) liff.closeWindow(); else location.reload(); };

function showConfirm(d) {
  $('confirmMsg').innerHTML = d.reason === 'gps'
    ? `<b class="warn">สัญญาณ GPS ไม่ชัด</b><p>ตำแหน่งคลาดได้ถึง ±${d.accuracy} เมตร ลองออกมาที่โล่งแล้วกด "ลองใหม่"</p>`
    : `<b class="warn">คุณอยู่ห่างร้าน ${d.distance} เมตร</b><p>(ต้องอยู่ในระยะ ${d.radius} เมตร) จะลงเวลาใหม่ตอนเข้าใกล้ร้านไหม</p>
       <p class="muted">ถ้ากด "ลงเวลาเลย" จะบันทึกได้ แต่มีป้ายเตือนให้เจ๊ตรวจ</p>`;
  hide('stepBox'); show('confirmBox');
}

async function send(force) {
  // เช็กระยะ/GPS ในมือถือก่อน ถ้าอยู่นอกรัศมีถามทันที ไม่ต้องรอระบบ (ระบบยังเช็กซ้ำและติดป้ายเหมือนเดิม)
  if (!force) {
    const b = curBranch(), dd = curDist(), acc = state.pos.acc;
    const maxAcc = Number(b.maxAcc) || 100;
    if (acc > maxAcc || dd > b.radius) {
      showConfirm({ reason: acc > maxAcc ? 'gps' : 'far', distance: dd, accuracy: Math.round(acc), radius: b.radius });
      return;
    }
  }
  state.sending = true; check();
  $('sendBtn').textContent = 'กำลังบันทึก...';
  $('forceBtn').disabled = true;
  $('forceBtn').textContent = 'กำลังบันทึก...';
  try {
    // ใช้เวลาที่ขอไว้ตอนถ่ายรูป (ส่วนใหญ่ได้มาแล้ว ไม่ต้องรอ) แล้วประทับลงรูปในมือถือ (เร็ว)
    const p = await getPrep();
    state.stamped = await stampPhoto(state.raw, {
      type: state.type, time: p.time, date: p.date, day: p.day,
      inTime: p.inTime, workMin: p.workMin,
      nickname: state.me.nickname, fullName: state.me.fullName, code: state.me.code,
      branch: $('branch').value, dist: curDist()
    });
    const d = await api('clock', {
      type: state.type, branch: $('branch').value,
      lat: state.pos.lat, lng: state.pos.lng, accuracy: state.pos.acc,
      photo: state.stamped, ts: p.ts, sig: p.sig,
      note: $('note').value.trim(), force
    });
    if (d.needConfirm) {
      showConfirm(d);
    } else {
      $('doneType').innerHTML = `<b class="${d.type === 'เข้า' ? 'ok' : 'bad'}">ลงเวลา${d.type}งานแล้ว</b>`;
      $('doneTime').textContent = d.time;
      $('doneName').innerHTML = '<b>' + esc(state.me.nickname) + '</b>' + (state.me.fullName ? ' · ' + esc(state.me.fullName) : '');
      $('doneInfo').textContent = d.branch + ' · ห่างร้าน ' + d.distance + ' ม.';
      $('doneNote').textContent = d.note ? 'หมายเหตุ: ' + d.note : '';
      $('doneFlags').textContent = d.flags.length ? '⚠️ ' + d.flags.join(' · ') : '';
      $('doneImg').src = state.stamped;
      $('doneGroup').textContent = '';
      hide('stepBox', 'confirmBox'); show('doneBox');
      notifyGroup(d, p);   // แจ้งเข้ากลุ่มไลน์ (ไม่ต้องรอ บันทึกเวลาเสร็จแล้ว)
    }
  } catch (e) {
    state.stamped = null;
    state.prepP = null; state.prep = null;   // ครั้งหน้าขอเวลาใหม่
    alert(e.message);
  }
  state.sending = false; check();
  $('sendBtn').textContent = 'บันทึกเวลา';
  $('forceBtn').disabled = false;
  $('forceBtn').textContent = 'ลงเวลาเลย';
}

// ----- แจ้งเข้ากลุ่มไลน์ (เฉพาะตอนเปิดลิงก์จากในกลุ่ม) -----
// ส่งในชื่อพนักงานเอง ฟรี / ต้องติ๊ก scope chat_message.write ใน LIFF / เปิดจากที่อื่น = ไม่แจ้ง
async function notifyGroup(d, p) {
  let ctx = null;
  try { ctx = liff.getContext(); } catch (e) {}
  if (!ctx || (ctx.type !== 'group' && ctx.type !== 'room')) {
    $('doneGroup').textContent = 'ไม่ได้แจ้งเข้ากลุ่ม (เปิดลิงก์จากนอกกลุ่มไลน์)';
    return;
  }
  const isIn = d.type === 'เข้า';
  const warn = (d.flags || []).filter(f => /^นอกรัศมี|^GPS ไม่ชัด/.test(f));
  const name = state.me.nickname + (state.me.fullName ? ' · ' + state.me.fullName : '');
  const txt = (t, o) => Object.assign({ type: 'text', text: String(t), wrap: true, size: 'sm', color: '#555555' }, o || {});
  const body = [
    txt(name, { size: 'md', weight: 'bold', color: '#222222' }),
    txt('📅 ' + ((p && p.day) ? p.day + ' ' : '') + ((p && p.date) || '')),
    txt('📍 ' + d.branch + ' · ห่างร้าน ' + d.distance + ' ม.')
  ];
  if (!isIn && p && p.inTime) body.push(txt('⏱ เข้า ' + p.inTime + ' – ออก ' + d.time + ' · ทำงาน ' + fmtDur(p.workMin)));
  if (warn.length) body.push(txt('⚠️ ' + warn.join(' · '), { color: '#c77800', weight: 'bold' }));
  if (d.note) body.push(txt('📝 ' + d.note));
  const head = (isIn ? '✅ เข้างาน ' : '🔴 เลิกงาน ') + d.time + ' น.';
  const msg = {
    type: 'flex',
    altText: state.me.nickname + ' ' + (isIn ? 'เข้างาน ' : 'เลิกงาน ') + d.time + ' · ' + d.branch,
    contents: {
      type: 'bubble', size: 'kilo',
      header: { type: 'box', layout: 'vertical', backgroundColor: isIn ? '#2a9d55' : '#d62828', paddingAll: '12px',
        contents: [{ type: 'text', text: head, color: '#ffffff', weight: 'bold', size: 'lg' }] },
      body: { type: 'box', layout: 'vertical', spacing: 'sm', paddingAll: '12px', contents: body }
    }
  };
  try {
    await liff.sendMessages([msg]);
    $('doneGroup').textContent = '📤 แจ้งเข้ากลุ่มไลน์แล้ว';
  } catch (e) {
    $('doneGroup').textContent = 'แจ้งเข้ากลุ่มไม่สำเร็จ (บันทึกเวลาเรียบร้อยแล้ว ไม่ต้องลงใหม่)';
  }
}

function dist(a1, o1, a2, o2) {
  const R = 6371000, r = Math.PI / 180;
  const x = Math.sin((a2 - a1) * r / 2) ** 2 + Math.cos(a1 * r) * Math.cos(a2 * r) * Math.sin((o2 - o1) * r / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}

start();
